services:
  # ============================================================================
  # 1. FastAPI Deep Learning Backend Service (CPU Mode)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nephroai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_ROOT=/data
      - MODEL_CHECKPOINT=/app/notebookV3/checkpoints/best_unet_kits23.pth
      - INFERENCE_BATCH_SIZE=4
      - SLICE_SUMMARY_OUTPUT_DIR=/app/reports/slice_summaries
      - CASE_BUNDLE_CACHE_DIR=/app/reports/case_bundles
      - UPLOADED_CASES_DIR=/app/uploaded_cases
    volumes:
      # Mount KiTS23 dataset into container (Read-Only)
      - D:\archive:/data:ro
      # Mount trained weights and reports
      - ./notebookV3/checkpoints:/app/notebookV3/checkpoints:ro
      - ./notebookV3/reports:/app/notebookV3/reports:ro
      - ./reports:/app/reports
      - ./uploaded_cases:/app/uploaded_cases
      # Mount backend code
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 2. React / Vite Frontend UI Service (Served on port 3000)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nephroai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: nephroai_network
